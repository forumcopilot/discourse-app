name: forumcopilot_flutter
description: "ForumCopilot"
publish_to: 'none'
version: 0.7.0+36

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  discourse_ui:
    path: ./packages/discourse_ui
  forumcopilot_sdk:
    path: ./packages/forumcopilot_sdk
  get: ^4.7.3
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Used by test/widget_test.dart to mock preference storage
  # (SharedPreferences.setMockInitialValues). Already a transitive
  # dependency via discourse_ui; declared here so the test may import it.
  shared_preferences: ^2.5.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
  - assets/forumcopiloticon_1024.png
  - assets/forumcopiloticon_256.png
  - assets/splash.png
  - assets/main_background.png
  - assets/forum_header_bg.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/forumcopiloticon_1024.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/forumcopiloticon_1024.png"
  # iOS adaptive icons
  ios_content_mode: scaleAspectFit
