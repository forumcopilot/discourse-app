name: forum_kit
description: "Platform-neutral UI kit shared by discourse-app and flarum-app: theme, widgets, utilities and services with no forum-platform code."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  crypto: ^3.0.0
  device_info_plus: ^11.2.0
  dio: ^5.4.0
  file_picker: ^10.3.10
  firebase_messaging: ^16.0.4
  flutter_cache_manager: ^3.4.1
  flutter_image_compress: ^2.3.0
  flutter_svg: ^2.0.10
  forumcopilot_sdk:
    path: ../forumcopilot_sdk
  get: ^4.7.3
  html: '>=0.15.6 <0.15.7' # 0.15.7 drops Element.matches, which flutter_html 3.0.0 still calls
  image_picker: ^1.2.1
  intl: ^0.20.2 # already in the graph via flutter_localizations
  path: ^1.9.0
  path_provider: ^2.1.0
  permission_handler: ^12.0.0+1
  shared_preferences: ^2.5.1
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Addressed as packages/forum_kit/assets/…
  assets:
    - assets/
