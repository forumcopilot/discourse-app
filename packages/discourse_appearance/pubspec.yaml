name: discourse_appearance
description: "Carries the app's light/dark choice to the native layer, so web views, share sheets and other system UI match it."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.forumcopilot.discourse_appearance
        pluginClass: DiscourseAppearancePlugin
      ios:
        pluginClass: DiscourseAppearancePlugin
      macos:
        pluginClass: DiscourseAppearancePlugin
